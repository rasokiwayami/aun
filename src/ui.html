<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ひとつずつ — 話しながら</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%233b5847'/%3E%3Cpath d='M9 16h2m3-5v10m4-14v18m4-13v8' stroke='%23f8f6ee' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"><style>
:root{--bg:#f6f5ef;--ink:#283d32;--muted:#778075;--line:#dcded3;--green:#3b5847;--light:#eceee5;--err:#974a3a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 -apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif}button,input,textarea,select{font:inherit;color:inherit}button,a{touch-action:manipulation}button{cursor:pointer;border:0;background:none;padding:10px 15px;border-radius:11px}button:hover{background:var(--light)}button:disabled{cursor:default;opacity:.45}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #86a289;outline-offset:4px}a{color:inherit}header{height:90px;max-width:1180px;margin:auto;padding:22px 35px;display:flex;align-items:center;justify-content:space-between}.wordmark{font-size:18px;letter-spacing:.1em}.top-actions{display:flex;gap:10px;align-items:center}.quiet{font-size:13px;color:var(--muted)}.label{font-size:12px;letter-spacing:.07em;color:var(--muted)}main{max-width:810px;margin:9vh auto 0;padding:0 30px;text-align:center}.focus{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}.kicker{display:flex;align-items:center;gap:9px;margin-bottom:24px}.tiny-dot{width:6px;height:6px;border-radius:100%;background:#8a9b80}h1{font-size:clamp(25px,3.6vw,35px);font-weight:520;line-height:1.7;margin:0;white-space:pre-line;letter-spacing:.015em}.guide{font-size:14px;color:var(--muted);margin:18px 0 0}.voice-area{display:flex;align-items:center;flex-direction:column;padding-top:10px}.orb{height:88px;width:88px;border:1px solid #bcc6b2;border-radius:50%;background:radial-gradient(circle at 38% 32%,#dce4d3,#c5d1bc);display:flex;gap:4px;justify-content:center;align-items:center;box-shadow:0 0 0 9px #e8ece24d,0 0 0 19px #eef0e833;transition:background .4s;position:relative}.orb span{display:block;width:3px;border-radius:3px;height:13px;background:#5d7758;transform:scaleY(var(--level,1));transition:transform .13s}.orb span:nth-child(2),.orb span:nth-child(4){height:23px}.orb span:nth-child(3){height:32px}.orb.thinking{animation:breathe 2s ease-in-out infinite}.state{font-size:13px;color:var(--muted);min-height:24px;margin:25px 0 14px}.primary{background:var(--green);color:#fff;border-radius:100px;padding:12px 25px;font-size:15px;min-height:48px}.primary:hover{background:#2c4737}.outline{border:1px solid var(--line);background:#ffffff66;border-radius:100px}.controls{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;min-height:52px}.meta{margin-top:20px;font-size:12px;color:var(--muted)}.composer{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--line);border-radius:18px;background:#ffffffa6;padding:9px;max-width:600px;margin:24px auto 0;text-align:left}.composer textarea{width:100%;resize:none;min-height:47px;max-height:160px;background:none;border:0;padding:9px;outline:0;line-height:1.7}.composer button{flex:none}.alert{font-size:13px;color:var(--err);max-width:560px;margin:16px auto;white-space:pre-line}.transcript{max-width:660px;margin:26px auto 0;text-align:left}.transcript summary{font-size:12px;color:var(--muted);cursor:pointer;text-align:center}.transcript-body{max-height:260px;overflow:auto;padding:15px 0}.line{margin:14px 0}.line .speaker{font-size:11px;color:var(--muted)}.line p{font-size:14px;margin:4px 0;white-space:pre-wrap}.line.user{padding-left:24px;border-left:2px solid #d9dfcf}.live-caption{font-size:14px;min-height:28px;color:var(--muted);max-width:630px;margin:20px auto 0;text-wrap:pretty}.bottom{max-width:1100px;margin:65px auto 0;padding:15px 30px 28px;display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted)}dialog{max-width:550px;width:calc(100vw - 36px);border:1px solid var(--line);border-radius:20px;background:var(--bg);color:var(--ink);padding:27px;max-height:85vh}dialog::backdrop{background:#2332274a}dialog h2{font-size:20px;font-weight:550;margin:0}.dialog-header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}dialog p{font-size:14px;color:var(--muted)}dialog label{display:block;font-size:13px;margin-top:18px}dialog select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);margin-top:8px;background:white}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}.record{padding:15px 0;border-top:1px solid var(--line)}.record p{margin:4px 0}.auth-button{background:#fff;border:1px solid #cdcec6;border-radius:10px;color:#222;font-weight:550;min-width:225px}.login-note{max-width:450px;margin:18px auto 0;font-size:12px;color:var(--muted)}[hidden]{display:none!important}@keyframes breathe{50%{opacity:.55;transform:scale(.96)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:600px){header{height:75px;padding:18px 20px}.wordmark{font-size:16px}.top-actions{gap:0}main{margin-top:6vh;padding:0 24px}.focus{min-height:230px}h1{font-size:26px}.voice-area{padding-top:0}.bottom{margin-top:35px;padding:15px 24px;flex-wrap:wrap}.guide{font-size:13px}.top-actions button{padding:8px}.controls{gap:7px}}
</style></head><body>
<header><span class="wordmark">ひとつずつ</span><div class="top-actions"><button class="quiet" id="historyButton">記録</button><button class="quiet" id="settingsButton">設定</button></div></header>
<main><section class="focus"><div class="kicker"><span class="tiny-dot"></span><span class="label" id="topicLabel">いま、話したいことから</span></div><h1 id="question">自由な時間が増えたら、<br>何をしたい？</h1><p class="guide" id="guide">思いつくことから、そのまま話して大丈夫です。</p></section>
<section class="voice-area"><div id="orb" class="orb" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div><div class="state" id="status" role="status"></div><div class="controls"><button id="connect" class="auth-button">Continue with ChatGPT</button><button id="start" class="primary" hidden>話しはじめる</button><button id="pause" class="outline" hidden>少し待って</button><button id="finish" class="quiet" hidden>今日はここまで</button></div><div id="loginNote" class="login-note">ChatGPTの利用枠で会話します。</div><div id="modeLinks" class="meta" hidden><button id="textMode" class="quiet">文字で話す</button><button id="skip" class="quiet">別の話題へ</button></div></section>
<p id="caption" class="live-caption" aria-live="off"></p><p id="error" class="alert" role="alert"></p>
<form id="composer" class="composer" hidden><textarea id="message" rows="1" placeholder="まとまっていなくても、そのままで。" aria-label="会話への入力"></textarea><button type="submit" class="primary" id="send" aria-label="送信">送る</button></form>
<details class="transcript" id="transcript"><summary>会話を見る</summary><div class="transcript-body" id="transcriptBody"><p class="quiet">話した内容は、ここに残ります。</p></div></details>
</main><footer class="bottom"><span id="storageState">話した内容は、このMacに保存</span><span>全部に答える必要はありません</span></footer>
<dialog id="settings"><div class="dialog-header"><h2>会話の設定</h2><button data-close="settings" class="quiet">閉じる</button></div><label>いま話したいこと<select id="topic"><option value="start">まずは、今のこと</option><option value="values">大事にしたいこと</option><option value="ai">AIに任せたいこと</option><option value="learning">研究・学び</option><option value="life">時間と暮らし</option><option value="people">人との関わり</option><option value="taste">好きなもの</option><option value="mail">メール・伝え方</option><option value="decisions">迷ったときの決め方</option><option value="changes">今の自分・変わったこと</option><option value="privacy">情報の扱い</option></select></label><label>返事の間合い<select id="pace"><option value="slow">ゆっくり待つ</option><option value="normal">ふつう</option></select></label><div class="row"><button id="applySettings" class="primary">この設定で</button></div><hr style="border:0;border-top:1px solid var(--line);margin-top:25px"><div id="accountInfo" class="quiet">ChatGPT未接続</div><div class="row"><a class="quiet" href="https://chatgpt.com/settings/usage" target="_blank" rel="noopener noreferrer">利用量を確認</a><button id="disconnect" class="quiet" hidden>ログアウト</button></div><p id="voiceInfo">音声はこのMacで文字にします。元の設計書と会話の文章はChatGPTに送ります。</p></dialog>
<dialog id="history"><div class="dialog-header"><h2>話したこと</h2><button data-close="history" class="quiet">閉じる</button></div><div id="historyBody"><p>まだ記録はありません。</p></div><div class="row"><button id="export" class="outline">記録を書き出す</button></div><p>必要なところだけ、あとから見直せます。</p></dialog>
<script type="module" src="/client.js"></script></body></html>
